site_name: problem-details-java
site_description: Framework-agnostic Java implementation of RFC 9457, Problem Details for HTTP APIs.
site_author: Othmane Ataallah
site_url: https://othmaneataallah.github.io/problem-details-java/
repo_url: https://github.com/othmaneataallah/problem-details-java
repo_name: GitHub

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Core concepts: core.md
  - JSON: json.md
  - XML: xml.md
  - Registry: registry.md
  - Spring: spring.md
  - JAX-RS: jaxrs.md
  - Demos: demos.md
  - Compatibility: compatibility.md
  - FAQ: faq.md
  - API reference: api.md
