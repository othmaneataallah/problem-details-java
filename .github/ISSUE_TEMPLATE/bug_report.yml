name: Bug report
description: Something broken, confusing, or surprising
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Java version, framework (Spring Boot / Jersey / plain Java), relevant dependency versions
      placeholder: e.g. Java 21, Spring Boot 4.1, Jackson 3.2
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the actual response body or stack trace if there is one
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that shows the problem
    validations:
      required: true
